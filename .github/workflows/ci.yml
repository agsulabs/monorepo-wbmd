name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm -w install --frozen-lockfile

      - name: Lint
        run: pnpm -w lint

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Test
        run: pnpm -w test

      - name: Smoke
        run: pnpm smoke

      - name: Start backend
        run: |
          node apps/backend/dist/main.js > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3001/health && exit 0
            sleep 1
          done
          echo "Backend did not start in time"
          cat backend.log || true
          exit 1

      - name: Fetch OpenAPI snapshot candidate
        run: pnpm -C packages/api-client openapi:fetch

      - name: Check OpenAPI diff
        run: pnpm -C packages/api-client openapi:check

      - name: Generate api-client
        run: pnpm -C packages/api-client generate

      - name: Check api-client diff
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- packages/api-client/src/gen)" ]; then
            echo "api-client is out of date. Run generate and commit changes"
            git status --porcelain --untracked-files=all -- packages/api-client/src/gen
            exit 1
          fi

      - name: Stop backend
        if: always()
        run: |
          kill $(cat backend.pid) || true
